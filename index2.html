<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Hub</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }
        #game-box {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 450px;
            margin: 0 auto;
            background: #111;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Панель счетов */
        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 100;
            pointer-events: none;
        }
        .stat {
            background: rgba(0,0,0,0.8);
            border: 1px solid #444;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
        }
        /* Радужный бегущий текст */
        .banner {
            position: absolute;
            top: 12%;
            width: 100%;
            font-size: 20px;
            font-weight: 900;
            white-space: nowrap;
            overflow: hidden;
            z-index: 50;
            pointer-events: none;
        }
        .banner-inner {
            display: inline-block;
            animation: moveText 6s linear infinite, rainbowColor 2s linear infinite;
        }
        @keyframes moveText {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        @keyframes rainbowColor {
            0% { color: #ff0000; }
            33% { color: #00ff00; }
            66% { color: #00ffff; }
            100% { color: #ff0000; }
        }
        /* Экраны и меню */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 25, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 200;
        }
        .screen.hidden {
            display: none !important;
        }
        h1 {
            font-size: 24px;
            color: #00ffff;
            text-align: center;
            margin-bottom: 10px;
        }
        .btn {
            background: linear-gradient(135deg, #ff007f, #7f00ff);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            width: 260px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,0,127,0.4);
        }
        .btn-dino { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .btn-clicker { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .btn-shop { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; }
        .btn-back { background: #444; width: 180px; }
        .btn:active { transform: scale(0.95); }

        /* Магазин */
        .shop-box {
            width: 85%;
            max-height: 250px;
            overflow-y: auto;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .shop-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
        }
        .shop-btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .shop-btn.owned { background: #00ff88; }
        .tabs { display: flex; gap: 6px; margin-bottom: 5px; }
        .tab-btn { background: #222; color: #aaa; border: 1px solid #555; padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .tab-btn.active { background: #00ffff; color: #000; font-weight: bold; }

        /* Кликер */
        #clicker-view {
            background: radial-gradient(circle, #300 0%, #000 100%);
        }
        .troll-avatar {
            width: 180px;
            height: 180px;
            cursor: pointer;
            filter: drop-shadow(0 0 15px #00ff00);
        }
        .pop-txt {
            position: absolute;
            color: #00ff00;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 300;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }
    </style>
</head>
<body>

<div id="game-box">
    <canvas id="cvs"></canvas>

    <div id="banner" class="banner hidden">
        <span class="banner-inner">Матвей лох Саша лох Егор лох — МАТВЕЙ ЛОХ САША ЛОХ ЕГОР ЛОХ —</span>
    </div>

    <div class="hud">
        <div class="stat" style="color:#00ffff;">Очки: <span id="score-val">0</span></div>
        <div class="stat" style="color:#ffd700;">🐹 <span id="hmstr-val">0</span></div>
        <div class="stat" style="color:#00ff88;">🌵 <span id="cactus-val">0</span></div>
    </div>

    <!-- МЕНЮ ХАБА -->
    <div id="menu-hub" class="screen">
        <h1>ИГРОВОЙ ХАБ</h1>
        <button class="btn" id="go-flappy">🚀 FLAPPY MI 10 ULTRA</button>
        <button class="btn btn-dino" id="go-dino">🦖 DINO RUNNER</button>
        <button class="btn btn-clicker" id="go-clicker">👹 MANGO CLICKER</button>
        <button class="btn btn-shop" id="go-shop">МАГАЗИН И КАРТЫ</button>
    </div>

    <!-- МЕНЮ FLAPPY -->
    <div id="menu-flappy" class="screen hidden">
        <h1>FLAPPY MI 10 ULTRA</h1>
        <button class="btn" id="start-flappy">ИГРАТЬ</button>
        <button class="btn btn-back" data-hub>В ХАБ</button>
    </div>

    <!-- МЕНЮ DINO -->
    <div id="menu-dino" class="screen hidden">
        <h1>GOOGLE DINO RUNNER</h1>
        <p style="font-size:12px; color:#aaa;">Прыгай и собирай Cactus Coins!</p>
        <button class="btn btn-dino" id="start-dino">ИГРАТЬ</button>
        <button class="btn btn-back" data-hub>В ХАБ</button>
    </div>

    <!-- КЛИКЕР -->
    <div id="clicker-view" class="screen hidden">
        <div style="font-size:24px; color:#ffd700; font-weight:bold;">🐹 <span id="clicker-coins">0</span></div>
        <div style="font-size:12px; color:#aaa;">Клик: +<span id="c-pow">1</span> | Авто: +<span id="a-pow">0</span>/сек</div>
        
        <svg id="troll-btn" class="troll-avatar" viewBox="0 0 200 240">
            <path d="M 30,80 Q 20,20 70,50 Q 100,10 130,50 Q 180,20 170,80 Q 190,130 160,190 Q 100,240 40,190 Q 10,130 30,80 Z" fill="#111" stroke="#00ff66" stroke-width="4"/>
            <polygon points="50,55 65,15 85,45 100,5 115,45 135,15 150,55" fill="#ffd700"/>
            <circle cx="70" cy="100" r="16" fill="#ff0000"/><circle cx="130" cy="100" r="16" fill="#ff0000"/>
            <path d="M 45,140 Q 100,215 155,140 Z" fill="#fff"/>
        </svg>

        <div style="display:flex; gap:10px;">
            <button class="btn" id="upg-c-btn" style="width:130px; font-size:11px;">Клик (15 🐹)</button>
            <button class="btn btn-dino" id="upg-a-btn" style="width:130px; font-size:11px;">Авто (50 🐹)</button>
        </div>
        <button class="btn btn-back" data-hub>В ХАБ</button>
    </div>

    <!-- МАГАЗИН -->
    <div id="menu-shop" class="screen hidden">
        <h1>МАГАЗИН</h1>
        <div class="tabs">
            <button class="tab-btn active" id="tab-s">ПЕРСОНАЖИ</button>
            <button class="tab-btn" id="tab-m">КАРТЫ DINO</button>
            <button class="tab-btn" id="tab-u">УЛУЧШЕНИЯ</button>
        </div>
        <div class="shop-box" id="shop-list"></div>
        <button class="btn btn-back" data-hub>НАЗАД</button>
    </div>

    <!-- GAME OVER -->
    <div id="menu-over" class="screen hidden">
        <h1 style="color:#ff3366;">КРАШ!</h1>
        <p>Счёт: <span id="end-score">0</span></p>
        <button class="btn" id="restart-btn">ЕЩЁ РАЗ</button>
        <button class="btn btn-back" data-hub>В ХАБ</button>
    </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const cvs = document.getElementById('cvs');
    const ctx = cvs.getContext('2d');

    function resize() {
        cvs.width = cvs.parentElement.clientWidth;
        cvs.height = cvs.parentElement.clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Данные
    let hmstr = parseInt(localStorage.getItem('f_h') || '0');
    let cactus = parseInt(localStorage.getItem('f_c') || '0');
    let skins = JSON.parse(localStorage.getItem('f_skins') || '["mango_troll"]');
    let curSkin = localStorage.getItem('f_cur_s') || 'mango_troll';
    let maps = JSON.parse(localStorage.getItem('f_maps') || '["classic"]');
    let curMap = localStorage.getItem('f_cur_m') || 'classic';
    let upgs = JSON.parse(localStorage.getItem('f_upgs') || '{"magnet":0,"shield":0,"double":0}');

    let cPower = parseInt(localStorage.getItem('f_cp') || '1');
    let aPower = parseInt(localStorage.getItem('f_ap') || '0');
    let cCost = 15, aCost = 50;

    function updateUI() {
        document.getElementById('hmstr-val').innerText = hmstr;
        document.getElementById('clicker-coins').innerText = hmstr;
        document.getElementById('cactus-val').innerText = cactus;
        localStorage.setItem('f_h', hmstr);
        localStorage.setItem('f_c', cactus);
    }
    updateUI();

    let state = 'HUB';
    let score = 0, frame = 0;
    let p = { x: 80, y: 300, vy: 0, g: 0.4, jump: -7.5, grounded: false };
    let obstacles = [], coins = [], cItems = [];

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if (id === 'menu-flappy' || id === 'menu-dino') {
            document.getElementById('banner').classList.remove('hidden');
        } else {
            document.getElementById('banner').classList.add('hidden');
        }
    }

    // Обработчики кнопок с поддержкой touch + click без промахов
    function bindClick(elId, fn) {
        const el = document.getElementById(elId);
        if (el) {
            el.addEventListener('click', fn);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); fn(); });
        }
    }

    document.querySelectorAll('[data-hub]').forEach(btn => {
        btn.addEventListener('click', () => { state = 'HUB'; showScreen('menu-hub'); });
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); state = 'HUB'; showScreen('menu-hub'); });
    });

    bindClick('go-flappy', () => showScreen('menu-flappy'));
    bindClick('go-dino', () => showScreen('menu-dino'));
    bindClick('go-clicker', () => showScreen('clicker-view'));
    bindClick('go-shop', () => { renderShop(); showScreen('menu-shop'); });

    bindClick('start-flappy', () => { state = 'FLAPPY'; resetGame(); showScreen('game-box'); document.getElementById('banner').classList.remove('hidden'); });
    bindClick('start-dino', () => { state = 'DINO'; resetGame(); p.y = cvs.height - 90; showScreen('game-box'); document.getElementById('banner').classList.remove('hidden'); });
    bindClick('restart-btn', () => { if (state === 'DINO') startDino(); else startFlappy(); });

    function resetGame() {
        score = 0; frame = 0; p.vy = 0; obstacles = []; coins = []; cItems = [];
        document.getElementById('score-val').innerText = '0';
    }

    // Управление прыжком
    window.addEventListener('click', () => { if (state === 'FLAPPY' || state === 'DINO') jump(); });
    window.addEventListener('touchstart', () => { if (state === 'FLAPPY' || state === 'DINO') jump(); });
    window.addEventListener('keydown', (e) => { if (e.code === 'Space') jump(); });

    function jump() {
        if (state === 'FLAPPY') p.vy = p.jump;
        if (state === 'DINO' && p.grounded) { p.vy = -11; p.grounded = false; }
    }

    // Кликер тапы
    const trollBtn = document.getElementById('troll-btn');
    const tapAction = (e) => {
        hmstr += cPower; updateUI();
        let pop = document.createElement('div');
        pop.className = 'pop-txt'; pop.innerText = `+${cPower}`;
        let clientX = e.clientX || (e.touches && e.touches[0].clientX) || 150;
        let clientY = e.clientY || (e.touches && e.touches[0].clientY) || 150;
        pop.style.left = `${clientX - 10}px`; pop.style.top = `${clientY - 20}px`;
        document.body.appendChild(pop);
        setTimeout(() => pop.remove(), 600);
    };
    trollBtn.addEventListener('click', tapAction);
    trollBtn.addEventListener('touchstart', (e) => { e.preventDefault(); tapAction(e); });

    setInterval(() => { if (aPower > 0) { hmstr += aPower; updateUI(); } }, 1000);

    bindClick('upg-c-btn', () => {
        if (hmstr >= cCost) { hmstr -= cCost; cPower++; cCost = Math.floor(cCost * 1.7); updateUI(); }
    });
    bindClick('upg-a-btn', () => {
        if (hmstr >= aCost) { hmstr -= aCost; aPower++; aCost = Math.floor(aCost * 2); updateUI(); }
    });

    // Магазин вкладки
    let activeTab = 's';
    bindClick('tab-s', () => { activeTab = 's'; setTab(0); renderShop(); });
    bindClick('tab-m', () => { activeTab = 'm'; setTab(1); renderShop(); });
    bindClick('tab-u', () => { activeTab = 'u'; setTab(2); renderShop(); });

    function setTab(idx) {
        let tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(t => t.classList.remove('active'));
        tabs[idx].classList.add('active');
    }

    function renderShop() {
        let box = document.getElementById('shop-list');
        box.innerHTML = '';
        if (activeTab === 's') {
            let items = [{id:'mango_troll', name:'Волосатый Демон Манго', p:0}, {id:'vivo', name:'Vivo X100 Pro', p:20}];
            items.forEach(s => {
                let owned = skins.includes(s.id), cur = curSkin === s.id;
                box.innerHTML += `<div class="shop-row"><span>${s.name}</span><button class="shop-btn ${owned?'owned':''}" onclick="buySkin('${s.id}', ${s.p})">${cur?'ВЫБРАНО':(owned?'ВЫБРАТЬ':s.p+' 🐹')}</button></div>`;
            });
        } else if (activeTab === 'm') {
            let mapsList = [{id:'classic', name:'Google Pixel', p:0}, {id:'cyber', name:'Киберпанк 🌵', p:25}];
            mapsList.forEach(m => {
                let owned = maps.includes(m.id), cur = curMap === m.id;
                box.innerHTML += `<div class="shop-row"><span>${m.name}</span><button class="shop-btn ${owned?'owned':''}" onclick="buyMap('${m.id}', ${m.p})">${cur?'ВЫБРАНО':(owned?'ВЫБРАТЬ':m.p+' 🌵')}</button></div>`;
            });
        }
    }

    window.buySkin = (id, pPrice) => {
        if (skins.includes(id)) curSkin = id;
        else if (hmstr >= pPrice) { hmstr -= pPrice; skins.push(id); curSkin = id; }
        updateUI(); renderShop();
    };
    window.buyMap = (id, pPrice) => {
        if (maps.includes(id)) curMap = id;
        else if (cactus >= pPrice) { cactus -= pPrice; maps.push(id); curMap = id; }
        updateUI(); renderShop();
    };

    // Рендер персонажа (Mi 10 Ultra + Манго)
    function drawPlayer(x, y, rot) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        // Корпус Mi 10 Ultra
        ctx.fillStyle = '#222'; ctx.beginPath(); ctx.roundRect(-35, -12, 70, 24, 6); ctx.fill();
        ctx.fillStyle = '#666'; ctx.fillRect(-10, -8, 35, 16);
        // Манго
        if (curSkin === 'mango_troll') {
            ctx.fillStyle = '#ff9900'; ctx.beginPath(); ctx.ellipse(0, -22, 16, 14, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ff0000'; ctx.beginPath(); ctx.arc(-5, -26, 3, 0, Math.PI * 2); ctx.arc(5, -26, 3, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
    }

    // Главный игровой цикл
    function loop() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);

        if (state === 'FLAPPY') {
            frame++; p.vy += p.g; p.y += p.vy;
            if (frame % 90 === 0) {
                let gap = 200, topH = Math.random() * (cvs.height - gap - 120) + 40;
                obstacles.push({ x: cvs.width, top: topH, bottom: cvs.height - topH - gap, passed: false });
                coins.push({ x: cvs.width + 35, y: topH + gap / 2, collected: false });
            }
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let o = obstacles[i]; o.x -= 3;
                ctx.fillStyle = '#300'; ctx.fillRect(o.x, 0, 60, o.top);
                let bY = cvs.height - o.bottom; ctx.fillRect(o.x, bY, 60, o.bottom);
                if (!o.passed && o.x + 60 < p.x) { o.passed = true; score++; document.getElementById('score-val').innerText = score; }
                if (p.x + 25 > o.x && p.x - 25 < o.x + 60 && (p.y - 20 < o.top || p.y + 15 > bY)) { gameOver(); }
                if (o.x < -70) obstacles.splice(i, 1);
            }
            coins.forEach(c => {
                c.x -= 3;
                if (!c.collected) {
                    ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(c.x, c.y, 12, 0, Math.PI * 2); ctx.fill();
                    if (Math.hypot(p.x - c.x, p.y - c.y) < 35) { c.collected = true; hmstr++; updateUI(); }
                }
            });
            if (p.y >= cvs.height || p.y <= 0) gameOver();
            drawPlayer(p.x, p.y, p.vy * 0.05);

        } else if (state === 'DINO') {
            ctx.fillStyle = curMap === 'cyber' ? '#0b001a' : '#181818';
            ctx.fillRect(0, 0, cvs.width, cvs.height);
            let gY = cvs.height - 70;
            ctx.fillStyle = '#444'; ctx.fillRect(0, gY, cvs.width, 70);

            frame++; p.vy += p.g * 1.3; p.y += p.vy;
            if (p.y >= gY - 15) { p.y = gY - 15; p.vy = 0; p.grounded = true; }

            if (frame % 100 === 0) {
                obstacles.push({ x: cvs.width, w: 25, h: 45, passed: false });
                if (Math.random() > 0.4) cItems.push({ x: cvs.width + 40, y: gY - 50, collected: false });
            }
            obstacles.forEach((o, i) => {
                o.x -= 4;
                ctx.fillStyle = '#00aa44'; ctx.fillRect(o.x, gY - o.h, o.w, o.h);
                if (!o.passed && o.x + o.w < p.x) { o.passed = true; score++; document.getElementById('score-val').innerText = score; }
                if (p.x + 20 > o.x && p.x - 20 < o.x + o.w && p.y + 15 > gY - o.h) { gameOver(); }
            });
            cItems.forEach(ci => {
                ci.x -= 4;
                if (!ci.collected) {
                    ctx.fillStyle = '#00ff88'; ctx.beginPath(); ctx.arc(ci.x, ci.y, 10, 0, Math.PI * 2); ctx.fill();
                    if (Math.hypot(p.x - ci.x, p.y - ci.y) < 30) { ci.collected = true; cactus++; updateUI(); }
                }
            });
            drawPlayer(p.x, p.y, 0);
        }
        requestAnimationFrame(loop);
    }

    function gameOver() {
        state = 'OVER';
        document.getElementById('end-score').innerText = score;
        showScreen('menu-over');
    }

    loop();
});
</script>
</body>
</html>
